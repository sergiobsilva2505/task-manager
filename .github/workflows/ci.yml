# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI/CD - Task Manager API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4.2.2

      - name: Configurar JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v4.2.1
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B clean verify

      - name: Publicar artefato da aplicacao (JAR)
        uses: actions/upload-artifact@v4.3.2
        with:
          name: task-manager-jar
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error

      - name: Publicar relatorios de teste (Surefire/Failsafe)
        if: always()
        uses: actions/upload-artifact@v4.3.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Publicar relatorio de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4.3.2
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: ignore

  qodana:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # necessário para analise de PR

      - name: Configurar JDK 21 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          upload-result: true
          args: |
            --linter,jetbrains/qodana-jvm-community:2026.1
        # env:
        #   QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}  # descomentar se criar conta no Qodana Cloud

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Deploy roda apenas em push direto para a branch 'main'.
    if: false  # TODO: reativar quando o slot 'Dev' estiver criado no Azure
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: 'Dev'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    steps:
      - name: Baixar artefato do job de build
        uses: actions/download-artifact@v4
        with:
          name: task-manager-jar
          path: app

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy no Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TaskManager'
          slot-name: 'Dev'
          package: 'app/*.jar'