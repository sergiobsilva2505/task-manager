# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI/CD - Task Manager API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 21 (Amazon Corretto)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B clean verify
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Publicar artefato da aplicacao (JAR)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task-manager-jar
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error

      - name: Publicar relatorios de teste (Surefire/Failsafe)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

      - name: Publicar relatorio de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: ignore

  qodana:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # necessário para analise de PR

      - name: Configurar JDK 21 (Amazon Corretto)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Compilar projeto (gera classes do Lombok/MapStruct para análise)
        run: mvn -B clean compile

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          pr-mode: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_447950036 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

  sonarcloud:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # necessário para o SonarCloud analisar histórico de branch/PR

      - name: Configurar JDK 21 (Amazon Corretto)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Build, testes e análise SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: >
          mvn -B clean verify sonar:sonar
          -Dsonar.projectKey=sergiobsilva2505_task-manager
          -Dsonar.organization=sergiobsilva2505
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          
