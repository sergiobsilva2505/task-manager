version: 2

updates:
  # Dependências Maven (Spring Boot 4.1, Testcontainers, ArchUnit, sonar-maven-plugin, etc.)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # GitHub Actions usadas em ci.yml e deploy-publish.yml (inclui as pinadas por SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
