name: "🐛 Bug"
description: Reportar um comportamento incorreto no Task Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir, confira se esse bug já não foi reportado em outra issue.
        Quanto mais contexto (passos, logs, camada afetada), mais rápido a causa raiz é encontrada — ver
        [investigação de referência](../../wiki/Testcontainers-Connection-Refused) como exemplo do nível de detalhe
        que ajuda.

  - type: textarea
    id: descricao
    attributes:
      label: Descrição do bug
      description: O que está acontecendo?
      placeholder: "Ex: DELETE /api/tasks/{id} retorna 500 em vez de 204 quando o token está expirado..."
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer no lugar?
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Faça login e obtenha um token
        2. Chame POST /api/tasks com...
        3. Observe o erro em...
    validations:
      required: true

  - type: dropdown
    id: camada
    attributes:
      label: Camada afetada
      description: Se souber, ajuda a direcionar o bug direto pra área certa da arquitetura hexagonal.
      options:
        - domain
        - application (casos de uso)
        - adapters/input/rest (controllers, DTOs, security)
        - adapters/output/persistence
        - adapters/output/security
        - adapters/config
        - testes (unitário/integração/ArchUnit)
        - CI/CD
        - Não sei / outra
    validations:
      required: false

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Local (mvn test)
        - Local (mvn verify, com Testcontainers)
        - CI (GitHub Actions)
        - Produção
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace relevante
      description: Cole o trecho relevante — evite colar o log inteiro sem filtrar.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Já procurei por issues existentes sobre esse mesmo problema
          required: true
