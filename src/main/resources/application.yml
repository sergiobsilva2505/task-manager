server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  openapi:
    title: Task Manager API
    description: Sistema backend de gerenciamento de tarefas pessoais desenvolvido com Arquitetura Hexagonal (Ports & Adapters), focado em clean code, separacao de responsabilidades e facilidade de evolucao. Esta e a versao base do projeto, estabelecendo fundacoes solidas para futuras expansoes.
    contact:
      name: Sergio Bezerra da Silva
      email: sergiobz.silva@gmail.com
    servers:
      - url: http://localhost:8080
        description: Ambiente local
      - url: https://taskmanager.azurewebsites.net
        description: Produção (Azure)

spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update   # opções comuns: none, validate, update, create, create-drop
      show-sql: true       # mostra SQL no console
      properties:
        hibernate:
          format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml