server:
  port: 8080

spring:
  application:
    name: task-manager
  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  openapi:
    title: Task Manager API
    description: API de gerenciamento de tarefas construída com Java 21 + Spring Boot, seguindo Arquitetura Hexagonal (Ports & Adapters)
    contact:
      name: Sergio Bezerra da Silva
      email: sergiobz.silva@gmail.com
    servers:
      - url: http://localhost:8080
        description: Ambiente local

  google:
    client-id: ${GOOGLE_CLIENT_ID}

  cors:
    address: /api/**
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"