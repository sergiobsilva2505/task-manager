server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  openapi:
    title: Task Manager API
    description: API de gerenciamento de tarefas construída com Java 21 + Spring Boot, seguindo Arquitetura Hexagonal (Ports & Adapters)
    contact:
      name: Sergio Bezerra da Silva
      email: sergiobz.silva@gmail.com
    servers:
      - url: http://localhost:8080
        description: Ambiente local

  cors:
    address: /api/**
    allowed-origins: http://localhost:4200
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
#    allow-credentials: true

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}

spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # opções comuns: none, validate, update, create, create-drop
    show-sql: true       # mostra SQL no console
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml