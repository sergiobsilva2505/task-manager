server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update   # opções comuns: none, validate, update, create, create-drop
      show-sql: true       # mostra SQL no console
      properties:
        hibernate:
          format_sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml