spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

app:
  cors:
    allowed-origins: http://localhost:4200

logging:
  level:
    root: INFO
    br.com.forjacode.taskmanager: DEBUG
