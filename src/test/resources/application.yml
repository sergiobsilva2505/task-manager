server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  openapi:
    title: Task Manager API
    description: API de gerenciamento de tarefas construída com Java 21 + Spring Boot, seguindo Arquitetura Hexagonal (Ports & Adapters)
    contact:
      name: Sergio Bezerra da Silva
      email: sergiobz.silva@gmail.com
    servers:
      - url: http://localhost:8080
        description: Ambiente local

  cors:
    address: /api/**
    allowed-origins: http://localhost:4200
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60

spring:
  application:
    name: task-manager

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml